# Local Postgres for development. Production uses Neon (see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d site']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
